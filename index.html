<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Engine Air Filter Inspection</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f6f8; margin:0; padding:20px; }
    .card { max-width:520px; margin:30px auto; background:#fff; border-radius:16px; padding:24px; box-shadow:0 6px 22px rgba(0,0,0,.08); }
    h1 { font-size:24px; margin-top:0; }
    .sub { color:#555; margin-bottom:20px; line-height:1.5; }
    input[type=file] { width:100%; margin:12px 0 16px; }
    #preview { display:none; width:100%; max-height:320px; object-fit:contain; border-radius:12px; background:#eee; margin-bottom:16px; }
    button { width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; }
    #status { margin-top:18px; padding:16px; border-radius:12px; background:#f0f2f5; white-space:pre-line; min-height:58px; line-height:1.5; }
    .small { margin-top:18px; color:#777; font-size:12px; line-height:1.5; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>AI Engine Air Filter Inspection</h1>
    <div class="sub">Take or upload a photo. The prototype first checks whether the image appears to show a car engine air filter, then classifies the filter as GOOD or BAD.</div>
    <input id="imageInput" type="file" accept="image/*" capture="environment" />
    <img id="preview" alt="Selected image preview" />
    <button id="inspectBtn">Inspect Filter</button>
    <div id="status">Waiting for an image.</div>
    <div class="small">Proof of concept only. Results are not a substitute for a physical service inspection.</div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
